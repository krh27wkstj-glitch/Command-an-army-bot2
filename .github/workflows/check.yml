name: Command An Army Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Roblox
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PREVIOUS_STATE: ${{ vars.PREVIOUS_STATE }}
        run: |
          node src/index.js | tee result.txt
          state=$(grep '^STATE:' result.txt | cut -c7-)
          echo "STATE=$state" >> "$GITHUB_ENV"

      - name: Save baseline
        env:
          GH_TOKEN: ${{ secrets.VARIABLES_TOKEN }}
        run: |
          for attempt in {1..3}; do
            if gh variable set PREVIOUS_STATE --body "$STATE"; then
              echo "Successfully saved state"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "Failed to save state after 3 attempts"
          exit 1
